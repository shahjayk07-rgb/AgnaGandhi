<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the past</title>
    <meta name="robots" content="noindex" />

    <!-- Same two families the original StayBesideHer page loads, so the
         typography carries straight through into the destination. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <!-- Warm the destination so the handover is instant. -->
    <link rel="prefetch" href="../staybesideher/index.html" />

    <style>
        :root {
            /* Tokens copied from the original StayBesideHer page. */
            --bg-color: #0a0a0f;
            --text-color: #f0f0f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
        }

        #doorway {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 40px 24px; overflow: hidden;
        }
        #doorway::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(58% 52% at 50% 46%, rgba(255,255,255,0.035), transparent 72%);
            opacity: 0; transition: opacity 2.4s ease;
        }
        #doorway.dw-lit::before { opacity: 1; }

        .dw-inner {
            position: relative; z-index: 2; width: min(640px, 100%);
            transition: opacity 2s ease;
        }
        .dw-inner.dw-out { opacity: 0; }

        .dw-line1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400; font-style: italic;
            font-size: clamp(1.65rem, 6.4vw, 3.6rem);
            line-height: 1.28; letter-spacing: 0.01em;
            color: var(--text-color); margin: 0;
            opacity: 0; transform: translateY(12px);
            transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dw-line1.dw-in { opacity: 1; transform: translateY(0); }

        .dw-rule {
            width: 48px; height: 1px; margin: 30px auto 0;
            background: rgba(240, 240, 240, 0.18);
            opacity: 0; transform: scaleX(0.4);
            transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dw-rule.dw-in { opacity: 1; transform: scaleX(1); }

        .dw-line2 {
            font-family: 'Outfit', sans-serif; font-weight: 300;
            font-size: clamp(0.95rem, 3.3vw, 1.3rem);
            line-height: 1.7; letter-spacing: 0.015em;
            color: rgba(240, 240, 240, 0.66);
            max-width: 34ch; margin: 28px auto 0;
            opacity: 0; transform: translateY(10px);
            transition: opacity 1.8s ease, transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dw-line2.dw-in { opacity: 1; transform: translateY(0); }

        @media (max-width: 560px) {
            #doorway { padding: 32px 20px; }
            .dw-rule { margin-top: 24px; }
            .dw-line2 { margin-top: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            #doorway::before { transition: opacity 0.6s linear; }
            .dw-inner { transition: opacity 0.5s linear; }
            .dw-line1, .dw-line2, .dw-rule {
                transform: none !important;
                transition: opacity 0.4s linear;
            }
        }
    </style>
</head>
<body>

    <div id="doorway" role="presentation">
        <div class="dw-inner" id="dwInner">
            <p class="dw-line1" id="dwLine1">Welcome to the past</p>
            <div class="dw-rule" id="dwRule"></div>
            <p class="dw-line2" id="dwLine2">And never forget, I always have your back.</p>
        </div>
    </div>

<script>
(function doorway(){
    "use strict";

    var reduce = window.matchMedia &&
                 window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var inner = document.getElementById('dwInner');
    var line1 = document.getElementById('dwLine1');
    var rule  = document.getElementById('dwRule');
    var line2 = document.getElementById('dwLine2');
    var dw    = document.getElementById('doorway');

    /* This page is the doorway itself, so there is no underlying experience to
       shield: the original StayBesideHer page is never overlaid or touched.
       Clicks here are simply swallowed so nothing can be triggered early. */
    document.addEventListener('click', function(e){ e.preventDefault(); }, true);

    var T_LINE1 = reduce ?  400 : 1200;
    var T_LINE2 = reduce ? 2000 : 3700;
    var T_OUT   = reduce ? 4500 : 6700;
    var T_GO    = reduce ? 5100 : 8700;

    setTimeout(function(){ line1.classList.add('dw-in'); dw.classList.add('dw-lit'); }, T_LINE1);
    setTimeout(function(){ rule.classList.add('dw-in'); line2.classList.add('dw-in'); }, T_LINE2);
    setTimeout(function(){ inner.classList.add('dw-out'); }, T_OUT);

    /* The destination's own loader is #0a0a0f, the same colour as this page,
       so the handover is a black-to-black join with no visible cut. */
    setTimeout(function(){ window.location.href = '../staybesideher/'; }, T_GO);
})();
</script>
</body>
</html>
